<svg width="960" height="240" viewBox="0 0 960 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEXOIT clean wordmark</title>
  <desc id="desc">A clean NEXOIT wordmark with a simple cyan N mark.</desc>
  <defs>
    <linearGradient id="cyan" x1="84" y1="66" x2="198" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="960" height="240" rx="28" fill="#050607"/>

  <g>
    <path d="M74 168V72L174 168V72" stroke="url(#cyan)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M101 91H164" stroke="#A5F3FC" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <path d="M113 108H176" stroke="#A5F3FC" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <circle cx="164" cy="91" r="4" fill="#A5F3FC"/>
    <circle cx="176" cy="108" r="3.5" fill="#22D3EE"/>
  </g>

  <text x="230" y="143" fill="#F8FAFC" font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="800" letter-spacing="3">
    NEXO<tspan fill="#22D3EE">IT</tspan>
  </text>

  <text x="234" y="177" fill="#94A3B8" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="2.2">
    CLEAN, SECURE TECHNOLOGY FOR GROWING TEAMS.
  </text>
</svg>
